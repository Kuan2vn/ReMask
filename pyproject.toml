[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remask-sfuda"
version = "0.1.0"
description = "Stage-aware reliability weighting for source-free underwater semantic segmentation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "torch>=1.10.1",
  "torchvision>=0.11.2",
  "numpy>=1.21",
  "Pillow>=8.3",
  "PyYAML>=5.4",
  "scipy>=1.7",
  "tqdm>=4.62",
]

[project.optional-dependencies]
data = ["pycocotools>=2.0.6"]

[tool.setuptools.packages.find]
include = ["remask*"]

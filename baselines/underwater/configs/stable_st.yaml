MODEL:
  NAME: deeplab_resnet101
  NUM_CLASSES: 8
  FREEZE_BN: true
DATASETS:
  SOURCE_TRAIN: uiis_train
  TARGET_TRAIN: suim_train
  TEST: suim_val
  TT: suim_TT_train
  II: suim_II_train
INPUT:
  SOURCE_INPUT_SIZE_TRAIN: [960, 480]
  TARGET_INPUT_SIZE_TRAIN: [960, 480]
  INPUT_SIZE_TEST: [1280, 640]
  INPUT_SCALES_TRAIN: [0.75, 1.25]
  HORIZONTAL_FLIP_PROB_TRAIN: 0.5
  BRIGHTNESS: 0.5
  CONTRAST: 0.5
  SATURATION: 0.5
  HUE: 0.2
DTU:
  DYNAMIC: true
  Query_STEP: 5
  Query_START: 10
  META_MAX_UPDATE: 21
  EMA_WEIGHT: 0.99
  PROXY_METRIC: NFD
  FIX_ITERATION: 12
TCR:
  OPEN: true
  TOPK_CANDIDATE: 0.5
  UPDATE_FREQUENCY: 3000
METAPL:
  OPEN: true
  VAL_UPDATE: 3000
  TOP_K: 0.05
SOLVER:
  BASE_LR: 0.00025
  MAX_ITER: 30000
  STOP_ITER: 30000
  BATCH_SIZE: 4
  CHECKPOINT_PERIOD: 500

name: Baseline checks
on:
  push:
    paths: ['baselines/**', 'experiments/rebuttal/**', 'remask/data/taxonomy.py', 'configs/uiis_to_suim.yaml', 'configs/usis10k_to_suim.yaml', 'requirements.txt', '.github/workflows/baselines.yml']
  pull_request:
    paths: ['baselines/**', 'experiments/rebuttal/**', 'remask/data/taxonomy.py', 'configs/uiis_to_suim.yaml', 'configs/usis10k_to_suim.yaml', 'requirements.txt', '.github/workflows/baselines.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python baselines/run.py --help
      - run: python -m unittest discover -s baselines/underwater/tests -v
      - run: python -m unittest discover -s experiments/rebuttal/tests -v
      - run: python experiments/rebuttal/run.py --suite all --protocol all --plan
